<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A6B39" />
      <stop offset="50%" stop-color="#044d27" />
      <stop offset="100%" stop-color="#022a15" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0A6B39" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Ring with Shadow -->
  <circle cx="250" cy="250" r="230" fill="url(#primaryGradient)" filter="url(#glow)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="10, 6" />

  <!-- Circular Text Tracks -->
  <path id="textTrackTop" d="M 70,250 A 180,180 0 1,1 430,250" fill="none" stroke="none" />
  <path id="textTrackBottom" d="M 430,250 A 180,180 0 0,1 70,250" fill="none" stroke="none" />

  <!-- Outer Typography -->
  <text fill="#FFFFFF" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="3.5">
    <textPath href="#textTrackTop" startOffset="50%" text-anchor="middle">
      HIMPUNAN MAHASISWA SISTEM INFORMASI
    </textPath>
  </text>
  <text fill="url(#goldGradient)" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3.5">
    <textPath href="#textTrackBottom" startOffset="50%" text-anchor="middle">
      UNIVERSITAS KEBANGSAAN REPUBLIK INDONESIA
    </textPath>
  </text>

  <!-- Decorative Stars on sides -->
  <polygon points="56,250 60,240 70,240 62,246 65,256 56,250 47,256 50,246 42,240 52,240" fill="#F59E0B" />
  <polygon points="444,250 448,240 458,240 450,246 453,256 444,250 435,256 438,246 430,240 440,240" fill="#F59E0B" />

  <!-- Inner Circle Border -->
  <circle cx="250" cy="250" r="150" fill="#032513" stroke="url(#goldGradient)" stroke-width="5" />

  <!-- Tech Grid Background -->
  <g opacity="0.18" stroke="#38BDF8" stroke-width="1.5">
    <line x1="120" y1="200" x2="380" y2="200" />
    <line x1="120" y1="250" x2="380" y2="250" />
    <line x1="120" y1="300" x2="380" y2="300" />
    <line x1="200" y1="120" x2="200" y2="380" />
    <line x1="250" y1="120" x2="250" y2="380" />
    <line x1="300" y1="120" x2="300" y2="380" />
  </g>

  <!-- Central Emblem: Shield & Tech Monogram -->
  <path d="M 250,135 L 340,175 L 340,265 C 340,325 250,365 250,365 C 250,365 160,325 160,265 L 160,175 Z" 
        fill="url(#primaryGradient)" stroke="url(#goldGradient)" stroke-width="4" />

  <!-- Shield Core Highlights -->
  <path d="M 250,150 L 325,185 L 325,260 C 325,310 250,345 250,345 C 250,345 175,310 175,260 L 175,185 Z" 
        fill="#05381D" opacity="0.85" />

  <!-- Digital Tech Nodes / Connectivity Network -->
  <g stroke="url(#cyanGradient)" stroke-width="3" fill="#38BDF8">
    <!-- Center Node -->
    <circle cx="250" cy="225" r="7" />
    <!-- Outer Connecting Nodes -->
    <line x1="250" y1="225" x2="210" y2="195" />
    <line x1="250" y1="225" x2="290" y2="195" />
    <line x1="250" y1="225" x2="250" y2="280" />
    <line x1="210" y1="195" x2="210" y2="250" />
    <line x1="290" y1="195" x2="290" y2="250" />
    <line x1="210" y1="250" x2="250" y2="280" />
    <line x1="290" y1="250" x2="250" y2="280" />

    <circle cx="210" cy="195" r="5" />
    <circle cx="290" cy="195" r="5" />
    <circle cx="210" cy="250" r="5" />
    <circle cx="290" cy="250" r="5" />
    <circle cx="250" cy="280" r="6" fill="#F59E0B" stroke="#F59E0B" />
  </g>

  <!-- Big Bold Modern Monogram 'HMSI' -->
  <text x="250" y="325" 
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="4">
    HMSI
  </text>

  <!-- Subtitle Tag -->
  <rect x="205" y="333" width="90" height="15" rx="7.5" fill="url(#goldGradient)" />
  <text x="250" y="344" 
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif" 
        font-size="10" 
        font-weight="800" 
        fill="#043319" 
        text-anchor="middle" 
        letter-spacing="1.5">
    UKRI
  </text>
</svg>
